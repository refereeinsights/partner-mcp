openapi: "3.1.0"
info:
  title: TournamentInsights Intelligence API
  description: Data intelligence and partner monetization tools for TournamentInsights / RefereeInsights
  version: "1.1.0"
servers:
  - url: https://partnermcp-git-main-rod-davis-projects.vercel.app
x-spec-url: https://partnermcp-git-main-rod-davis-projects.vercel.app/api/openapi
security:
  - bearerAuth: []
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /api/action:
    post:
      operationId: invokeTool
      summary: Invoke a TournamentInsights data or partner tool
      description: >
        Pass "tool" plus any tool-specific parameters at the top level of the
        request body. Do NOT nest parameters — include them alongside "tool".
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tool
              properties:
                tool:
                  type: string
                  description: Name of the tool to invoke.
                  enum:
                    - get_dataset_health
                    - get_summary_dashboard
                    - get_trends
                    - get_state_sport_coverage
                    - get_missing_fields
                    - get_organizer_clusters
                    - get_venue_clusters
                    - get_missing_venues
                    - get_tournament_venue_worklist
                    - get_association_dashboard
                    - get_email_outreach_numbers
                    - get_top_organizer_domains
                    - get_tournaments_by_domain
                    - get_unverified_tournaments
                    - get_tournaments_missing_source_urls
                    - get_admin_reference
                    - get_partner_pipeline
                    - get_partner_links
                    - get_partner_click_summary
                    - get_fanatics_routing
                    - get_partner_knowledge
                    - mcp_healthcheck
                    - insert_research_note
                    - insert_tournament_candidate
                    - upsert_organizer_watchlist
                    - upsert_partner
                    - upsert_partner_link
                    - insert_partner_note
                    - update_partner_status
                    - upsert_partner_placement
                    - insert_partner_test_result

                # ── Shared filter params ──────────────────────────────────
                sport:
                  type: string
                  description: >
                    Single sport filter. One of: soccer, baseball, softball,
                    lacrosse, basketball, hockey, volleyball, futsal.
                    Used by: get_missing_venues, get_organizer_clusters,
                    get_venue_clusters, get_missing_fields,
                    get_top_organizer_domains, get_unverified_tournaments,
                    get_tournaments_missing_source_urls.
                state:
                  type: string
                  description: >
                    Single 2-letter US state code (e.g. CA, TX).
                    Used by: get_missing_venues, get_organizer_clusters,
                    get_venue_clusters, get_missing_fields,
                    get_top_organizer_domains, get_unverified_tournaments,
                    get_tournaments_missing_source_urls.
                sports:
                  type: array
                  items:
                    type: string
                  description: >
                    Multiple sport filter. Used by: get_state_sport_coverage,
                    get_tournament_venue_worklist.
                states:
                  type: array
                  items:
                    type: string
                  description: >
                    Multiple 2-letter state codes. Used by:
                    get_state_sport_coverage, get_tournament_venue_worklist.
                limit:
                  type: integer
                  description: >
                    Maximum rows to return. Defaults and maximums vary by tool
                    (typically 100 default, 200–500 max).
                offset:
                  type: integer
                  description: Pagination offset (0-based).

                # ── Tournament Venue Worklist ─────────────────────────────
                venue_status:
                  type: string
                  enum:
                    - missing
                    - incomplete
                    - missing_or_incomplete
                    - complete
                    - any
                  description: >
                    Filter by venue completeness. "missing" = no venue linked;
                    "incomplete" = venue exists but missing name/city/state;
                    "missing_or_incomplete" = either; "any" = all (default).
                    Used by: get_tournament_venue_worklist.
                date_from:
                  type: string
                  description: >
                    Start of date window, YYYY-MM-DD. Overrides
                    weeks_from_now_start. Used by: get_tournament_venue_worklist.
                date_to:
                  type: string
                  description: >
                    End of date window, YYYY-MM-DD. Overrides
                    weeks_from_now_end. Used by: get_tournament_venue_worklist.
                weeks_from_now_start:
                  type: integer
                  description: >
                    Weeks from today to start the date window (default 2).
                    Used by: get_tournament_venue_worklist.
                weeks_from_now_end:
                  type: integer
                  description: >
                    Weeks from today to end the date window (default 6).
                    Used by: get_tournament_venue_worklist.

                # ── Cluster / coverage tools ──────────────────────────────
                min_tournaments:
                  type: integer
                  description: >
                    Minimum tournament count to include a cluster.
                    Used by: get_organizer_clusters (default 3),
                    get_venue_clusters (default 2),
                    get_top_organizer_domains (default 3).
                missing_any_of:
                  type: array
                  items:
                    type: string
                  description: >
                    Fields to check for missingness. Used by: get_missing_fields.
                    Values: official_website_url, tournament_director,
                    tournament_director_email, referee_contact,
                    referee_contact_email, start_date, end_date, city, state.
                domain:
                  type: string
                  description: >
                    Root domain to filter by (e.g. "gotsoccer.com").
                    Used by: get_tournaments_by_domain, get_top_organizer_domains.

                # ── Trends ────────────────────────────────────────────────
                period:
                  type: string
                  enum:
                    - week
                    - month
                    - quarter
                  description: Bucketing period. Used by: get_trends.
                lookback_periods:
                  type: integer
                  description: Number of periods to return. Used by: get_trends (max 52).

                # ── Knowledge / reference tools ───────────────────────────
                query:
                  type: string
                  description: >
                    Search query. Used by: get_partner_knowledge,
                    get_admin_reference.
                section:
                  type: string
                  description: Named section to retrieve. Used by: get_partner_knowledge.

                # ── Partner read tools ────────────────────────────────────
                partner_id:
                  type: string
                  description: Partner ID. Used by: get_partner_links, get_partner_click_summary.
                start_date:
                  type: string
                  description: Start date YYYY-MM-DD. Used by: get_partner_click_summary.
                end_date:
                  type: string
                  description: End date YYYY-MM-DD. Used by: get_partner_click_summary.

                # ── Write tools ───────────────────────────────────────────
                key:
                  type: string
                  description: Partner key. Used by: upsert_partner, update_partner_status.
                name:
                  type: string
                  description: Display name. Used by: upsert_partner.
                status:
                  type: string
                  description: Status value. Used by: upsert_partner, update_partner_status.
                organizer_domain:
                  type: string
                  description: Domain to watchlist. Used by: upsert_organizer_watchlist.
                reason:
                  type: string
                  description: Reason text. Used by: upsert_organizer_watchlist.
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags. Used by: upsert_organizer_watchlist.
                source_url:
                  type: string
                  description: Source URL. Used by: insert_tournament_candidate, insert_research_note.
                entity_type:
                  type: string
                  description: Entity type. Used by: insert_research_note.
                entity_id:
                  type: string
                  description: Entity ID. Used by: insert_research_note.
                title:
                  type: string
                  description: Title. Used by: insert_research_note.
                note:
                  type: string
                  description: Note text. Used by: insert_research_note, insert_partner_note.
                partner_key:
                  type: string
                  description: Partner key. Used by: insert_partner_note, update_partner_status, upsert_partner_placement, insert_partner_test_result.
                note_type:
                  type: string
                  description: Note type. Used by: insert_partner_note.
                label:
                  type: string
                  description: Display label. Used by: upsert_partner_link, upsert_partner_placement.
                url:
                  type: string
                  description: Affiliate URL. Used by: upsert_partner_link.
                placement_type:
                  type: string
                  description: Placement type. Used by: upsert_partner_placement.
                experiment_name:
                  type: string
                  description: Experiment name. Used by: insert_partner_test_result.
                ctr:
                  type: number
                  description: Click-through rate. Used by: insert_partner_test_result.
                clicks:
                  type: integer
                  description: Click count. Used by: insert_partner_test_result.
                conversions:
                  type: integer
                  description: Conversion count. Used by: insert_partner_test_result.
                notes:
                  type: string
                  description: Freeform notes. Used by: insert_partner_test_result.
                tested_at:
                  type: string
                  description: Test date YYYY-MM-DD. Used by: insert_partner_test_result.

      responses:
        "200":
          description: Successful tool result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: The tool output (structure varies by tool)
        "400":
          description: Unknown tool name
        "401":
          description: Missing or invalid bearer token
        "500":
          description: Tool execution error
